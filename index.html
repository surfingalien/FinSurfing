<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="FinSurf — Real-time portfolio tracking, 5-persona advisory engine, Monte Carlo simulation, and technical analysis for US equities." />
  <title>FinSurf — Stock Intelligence Platform</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M4 22 L10 14 L16 18 L22 8 L28 12' stroke='%232563EB' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round' fill='none'/></svg>" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#2563EB" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="FinSurf" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <script>
    /* Apply the theme BEFORE first paint. The React provider sets this class
       too, but it only runs after mount — long enough to flash the wrong
       theme on every load. Mirrors LightModeContext's resolution order
       (explicit choice → legacy key → light default) and must stay in sync
       with it. Wrapped in try/catch because localStorage throws in some
       privacy modes, where falling back to the default is correct. */
    (function () {
      try {
        var stored = localStorage.getItem('finsurf_lightmode')
        var light  = stored !== null
          ? stored === 'true'
          : (localStorage.getItem('finsurf_applemode') === 'true' || true)
        if (light) document.documentElement.classList.add('light-mode')
        if (localStorage.getItem('finsurf_promode') === 'true')
          document.documentElement.classList.add('pro-mode')
      } catch (e) {
        document.documentElement.classList.add('light-mode')
      }
    })()
  </script>
</head>
<body class="bg-surface text-white">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
